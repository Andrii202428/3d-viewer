<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Viewer</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; background:#111; color:#fff; }
    header { padding: 12px 16px; }
    model-viewer { width: 100%; height: 92vh; background:#1b1b1b; }
  </style>
</head>
<body>
  <header><b>3D Model Viewer</b></header>

  <model-viewer
    id="viewer"
    camera-controls
    auto-rotate
    shadow-intensity="0.4"
    exposure="0.6">
  </model-viewer>

  <script type="module">
    const viewer = document.querySelector("#viewer");

    const params = new URLSearchParams(location.search);
    const src = params.get("src") || "models/model.glb";

    viewer.src = src;

    viewer.addEventListener("load", async () => {
      await viewer.updateComplete;

      if (viewer.model?.materials) {
        for (const mat of viewer.model.materials) {
          const pbr = mat.pbrMetallicRoughness;
          pbr.setBaseColorFactor([0.22, 0.22, 0.22, 1]);
          pbr.setMetallicFactor(0.05);
          pbr.setRoughnessFactor(1.0);
        }
      }
    });
  </script>
</body>
</html>
